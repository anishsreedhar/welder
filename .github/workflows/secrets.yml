# Fails a push or pull request that adds an API key or token, a local settings file, or a commit
# with a personal email address. See tools/check_secrets.py.
name: secrets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for secrets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            python3 tools/check_secrets.py --commits "$BASE..$HEAD"
          else
            python3 tools/check_secrets.py
          fi
